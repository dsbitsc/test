<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Gopi vector render</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script></head>
<body>
<script type="module">
// Flat, cel-shaded orthographic renders (transparent background) used as input for SVG tracing.
import * as THREE from 'three';
import { buildCharacter } from './character.js';

const SIZE = 2000;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(SIZE, SIZE, false);
renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.width = SIZE + 'px';
renderer.domElement.style.height = SIZE + 'px';

const scene = new THREE.Scene();
const hero = buildCharacter({ fur: false });
// 3-band toon shading, same hues for every part
const grad = new THREE.DataTexture(new Uint8Array([70, 70, 70, 255, 160, 160, 160, 255, 255, 255, 255, 255]), 3, 1, THREE.RGBAFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
hero.traverse((o) => {
  if (!o.isMesh) return;
  const c = o.material.color ? o.material.color.clone() : new THREE.Color('#ffffff');
  if (o.material.isMeshBasicMaterial) return;
  o.material = new THREE.MeshToonMaterial({ color: c, gradientMap: grad });
});
scene.add(hero);

const cam = new THREE.OrthographicCamera(-1.25, 1.25, 1.25, -1.25, 0.1, 30);
const key = new THREE.DirectionalLight('#ffffff', 2.4);
const fill = new THREE.AmbientLight('#ffffff', 1.0);
scene.add(cam, fill);
cam.add(key); key.position.set(-1.5, 2.5, 2); key.target.position.set(0, 0, -2); cam.add(key.target);

const VIEWS = {
  side:  { pos: [0, 0.95, 6], t: [0.05, 0.95, 0] },
  front: { pos: [6, 0.95, 0], t: [0.05, 0.95, 0] },
  back:  { pos: [-6, 0.95, 0], t: [0.05, 0.95, 0] },
  top:   { pos: [0.05, 7, 0.001], t: [0.05, 0.95, 0] },
  threeq:{ pos: [3.6, 2.2, 4.6], t: [0.05, 0.95, 0] },
};
window.renderView = (name) => {
  const v = VIEWS[name];
  cam.position.set(...v.pos);
  cam.up.set(name === 'top' ? 1 : 0, name === 'top' ? 0 : 1, 0);
  cam.lookAt(...v.t);
  cam.updateMatrixWorld(true);
  renderer.render(scene, cam);
  return true;
};
window.ready = true;
</script>
</body></html>
